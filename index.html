<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>איכס דביר</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}

body{
  background:#000;
  color:#fff;
  font-family:Heebo,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:none;
}

/* subtle cinematic background */
body::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.055),transparent 18%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.018),transparent 45%);
  filter:blur(20px);
  pointer-events:none;
}

.noise{
  position:absolute;
  inset:0;
  opacity:.035;
  pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}

.content{
  position:relative;
  z-index:2;
  text-align:center;
  animation:enter 1.1s cubic-bezier(.16,1,.3,1) both;
}

h1{
  font-size:clamp(64px,13vw,190px);
  line-height:.9;
  font-weight:900;
  letter-spacing:-.075em;
  user-select:none;
  text-shadow:
    0 0 2px #fff,
    0 0 30px rgba(255,255,255,.08),
    0 0 90px rgba(255,255,255,.025);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}

.sub{
  margin-top:28px;
  font-size:12px;
  letter-spacing:.45em;
  opacity:.28;
  direction:ltr;
  text-transform:uppercase;
  user-select:none;
}

/* cursor */
.cursor{
  position:fixed;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  left:0;top:0;
  pointer-events:none;
  z-index:20;
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 5px 2px rgba(255,255,255,.95),
    0 0 18px 6px rgba(255,255,255,.65),
    0 0 45px 13px rgba(255,255,255,.28),
    0 0 90px 28px rgba(255,255,255,.09);
}

.cursor::after{
  content:"";
  position:absolute;
  width:34px;height:34px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  animation:pulse 2s ease-out infinite;
}

.trail{
  position:fixed;
  width:3px;height:3px;
  border-radius:50%;
  background:#fff;
  pointer-events:none;
  z-index:15;
  opacity:0;
  box-shadow:0 0 12px 3px rgba(255,255,255,.5);
}

@keyframes enter{
  from{opacity:0;transform:translateY(35px) scale(.96);filter:blur(10px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(.45);opacity:.8}
  70%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
  100%{opacity:0}
}
@media(max-width:600px){
  h1{font-size:22vw}
  .sub{font-size:9px;margin-top:18px}
}
</style>
</head>
<body>
<div class="noise"></div>

<main class="content">
  <h1 id="title">איכס דביר</h1>
  <div class="sub">nothing to see here</div>
</main>

<div class="cursor" id="cursor"></div>

<script>
const cursor=document.getElementById("cursor");
const title=document.getElementById("title");
let mx=innerWidth/2,my=innerHeight/2;
let cx=mx,cy=my;
let lastTrail=0;

const trails=[];
for(let i=0;i<14;i++){
  const el=document.createElement("div");
  el.className="trail";
  document.body.appendChild(el);
  trails.push({el,x:mx,y:my});
}

addEventListener("mousemove",e=>{
  mx=e.clientX; my=e.clientY;
  document.body.style.setProperty("--x",(mx/innerWidth*100)+"%");
  document.body.style.setProperty("--y",(my/innerHeight*100)+"%");

  const now=performance.now();
  if(now-lastTrail>28){
    const t=trails[Math.floor(Math.random()*trails.length)];
    t.x=mx; t.y=my;
    t.el.style.left=mx+"px";
    t.el.style.top=my+"px";
    t.el.style.opacity=".5";
    t.el.animate(
      [{transform:"translate(-50%,-50%) scale(1)",opacity:.45},
       {transform:"translate(-50%,-50%) scale(0)",opacity:0}],
      {duration:500,easing:"ease-out",fill:"forwards"}
    );
    lastTrail=now;
  }
});

function animate(){
  cx+=(mx-cx)*.22;
  cy+=(my-cy)*.22;
  cursor.style.left=cx+"px";
  cursor.style.top=cy+"px";

  const dx=(mx-innerWidth/2)/innerWidth;
  const dy=(my-innerHeight/2)/innerHeight;
  title.style.transform=`translate(${dx*8}px,${dy*5}px)`;

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
